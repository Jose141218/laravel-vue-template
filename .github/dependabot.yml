version: 2
updates:
  # 1. GitHub Actions (flujos de CI en .github/workflows/)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      actions:
        patterns:
          - '*'

  # 2. PHP / Laravel (composer.json & composer.lock)
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      composer-deps:
        patterns:
          - '*'

  # 3. Frontend / JavaScript (package.json & pnpm-lock.yaml)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-deps:
        patterns:
          - '*'
